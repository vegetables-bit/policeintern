{% extends 'core/base.html' %}

{% block content %}

<div class="container-fluid py-5 status-page">

    <div class="row justify-content-center align-items-center status-shell">

        <div class="col-12 col-sm-10 col-md-8 col-lg-6">

            <div class="status-card rounded-4">

                <!-- SUCCESS HEADER -->
                <div class="status-header success">

                    <div class="status-header-icon">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>

                    <h1>
                        Account Created Successfully
                    </h1>

                </div>

                <!-- MESSAGE -->
                <div class="status-body">

                    <p>
                        Your account has been created successfully.
                        <br><br>
                        Please proceed to the login page to access your dashboard and get started.
                    </p>

                    <!-- ACTION BUTTON -->
                    <div style="margin-top: 2rem;">
                        <a href="/login/"
                           class="btn btn-primary btn-lg px-5">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Go to Login
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
