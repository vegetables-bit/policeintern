{% extends 'core/base.html' %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="success-card shadow-lg p-5 text-center rounded-4">
                <div class="success-icon mb-4">
                    <i class="bi bi-check-circle-fill"></i>
                </div>

                <h2 class="text-success fw-bold mb-3">
                    Weekly Update Saved Successfully
                </h2>

                <p class="fs-5 mb-4">
                    The intern progress update was saved successfully.
                    You can return to your Police Dashboard to continue managing interns.
                </p>

                <a href="{% url 'police_dashboard' %}"
                   class="btn btn-primary btn-lg px-4">
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
