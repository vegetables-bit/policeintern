{% extends 'core/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow p-5">

                <h2 class="text-center mb-4">

                    Assign Supervisors

                </h2>

                <div class="mb-4">

                    <h5>
                        Intern:
                        {{ application.full_name }}
                    </h5>

                    <p>
                        {{ application.school_name }}
                    </p>

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <!-- Police Supervisor -->
                    <div class="mb-3">

                        <label class="form-label">

                            Select Police Supervisor

                        </label>

                        <select name="police_supervisor"
                                class="form-control"
                                required>

                            <option value="">
                                Choose Supervisor
                            </option>

                            {% for supervisor in police_supervisors %}

                            <option value="{{ supervisor.id }}">

                                {{ supervisor.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- School Supervisor -->
                    <div class="mb-4">

                        <label class="form-label">

                            Select School Supervisor

                        </label>

                        <select name="school_supervisor"
                                class="form-control"
                                required>

                            <option value="">
                                Choose Supervisor
                            </option>

                            {% for supervisor in school_supervisors %}

                            <option value="{{ supervisor.id }}">

                                {{ supervisor.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Save Assignment

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
