{% extends 'core/base.html' %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="success-card shadow-lg p-5 text-center rounded-4">
                <div class="success-icon mb-3"><i class="bi bi-bell-fill"></i></div>
                <h2 class="text-success fw-bold mb-3">Password Reset Sent</h2>
                <p class="mb-4">If an account with the provided email exists, a password reset link has been sent. Please check your inbox.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">Back to Login</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
