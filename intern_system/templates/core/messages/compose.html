{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h2 class="page-title text-start mb-0">Compose Message</h2>
        <a href="{% url 'messages_dashboard' %}" class="btn btn-light">Messages</a>
    </div>

    <div class="glass-card p-4">
        {% if allowed_receivers_count %}
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i> Send Message
                </button>
            </form>
        {% else %}
            <div class="alert alert-warning mb-0">
                No eligible recipients are currently assigned to your account.
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
